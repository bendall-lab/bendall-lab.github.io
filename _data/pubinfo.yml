# Google Scholar overrides (used by bin/update_references.py; optional).
#
# Force the Scholar publication for an entry when automatic matching (DOI / title+year /
# title) fails, e.g. Scholar lists a different title or "Unknown Year". Keys are a DOI
# (preferred: Paperpile bibkeys can change when an entry is re-created) or a Paperpile
# bibkey; DOIs are case-insensitive. Values are the Scholar pubid or the full
# "userid:pubid" key as it appears in _data/citations.yml. An override wins over automatic
# matching and the Scholar entry can't be claimed by another paper. The log lists unmatched
# entries with a ready-to-paste line.
scholar_overrides:
  # Scholar lists the preprint title "Human Endogenous Retrovirus (HERV) Profiling ...".
  "10.3389/fonc.2026.1708501": "4JMBOYKVnBMC" # Fei2026-zj


# Public PDF links (used by bin/resolve_links.py; all optional).
#
# Force a specific PDF/landing URL for one bibkey (wins over Unpaywall / Europe PMC):
# pdf_overrides:
#   Bendall2019-ui: "https://scholarspace.library.gwu.edu/..."
#
# Host the PDF yourself: public bucket base URL, plus the bibkeys to serve from it as
# <pdf_bucket_base>/<bibkey>.pdf (used only when no open-access PDF was found):
# pdf_bucket_base: "https://pdfs.example.org"
# pdf_bucket:
#   - Bendall2019-ui
