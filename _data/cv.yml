    Professional Summary:
      - bullet: "**Publications:** 38 peer-reviewed publications, 10 as first or senior author; h-index 18"
      - bullet: "**Teaching and mentoring:** formal mentoring of 5 postdoctoral scholars or graduate students; advising and supervision of 11 trainees; four years as Lecturer for Computational Biology Master’s Thesis Exploration (WCM); two years as Teaching Assistant for upper-level computational biology courses (BYU); lead organizer and instructor for Dark Matter Codeathon (WCM); instructor at 4 workshops on transposable elements or microbiome"
      - bullet: "**Research funding:** Principal Investigator on WCM Fund for the Future grant (completed 2024); Co-Investigator on NCI (R01CA260691) and NIAID (UM1AI164559) (through May 2026); Co-Investigator on NIDA SCORCH grant (through March 2030)"
      - bullet: "**Scientific contributions:** lead developer of four open-source software packages, including Telescope (100+ citations); author and developer of Pathoscope (100+ citations); contributor to other open-source bioinformatics projects such as Bioconda (600+ citations)"

