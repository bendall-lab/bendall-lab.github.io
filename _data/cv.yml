        position: Doctoral Research Assistant
        location: Washington, DC
        start_date: 2014-08
        end_date: 2019-07
        summary: "Advisor: Keith Crandall, PhD"
        highlights:
          - Investigated microbiome community composition and host-pathogen interactions in schizophrenia, pediatric asthma, and cystic fibrosis.
          - Performed statistical analysis for the WE-HEAL study and identified transcriptional patterns in hidradenitis suppurativa.
          - Developed the software package HAPHPIPE for viral haplotype assembly and phylodynamics; characterized HIV phylodynamics in Washington DC.
      - company: Joint Genome Institute, Lawrence Berkeley National Laboratory
        position: Bioinformatics Software Developer
        location: Walnut Creek, CA
        start_date: 2011-12
        end_date: 2014-08
        summary: "Synthetic Biology (Samuel Deutsch, PhD); Single Cell Genomics (Rex Malmstrom, PhD)"
        highlights:
          - Implemented analysis pipelines for the assembly, mapping, and annotation of metagenomic data using high-performance computing. Developed approaches for detecting selective sweeps using metagenomic time-series.
          - Led a team of software developers in building laboratory information management systems to support JGI’s Synthetic Biology and Single Cell Genomics programs.
          - Developed novel methods for identifying epigenetic modifications using PacBio’s single-molecule real-time (SMRT) sequencing technology.
      - company: Crandall Lab, Brigham Young University
        position: Graduate Research Assistant
        location: Provo, UT
        start_date: 2009-08
        end_date: 2011-12
        summary: "Advisor: Keith Crandall, PhD"
        highlights:
          - Developed the software package Pathoscope for strain level quantification of metagenomic NGS data.
          - Evaluated phylogenetic node calibration methods using empirical phylogenetic and fossil history.
          - Compared phylogenetic and structural approaches for identifying deleterious variants in ANGPTL4.
          - Evaluated the performance of methods for predicting sites under positive selection in drug-resistant HIV (thesis).
